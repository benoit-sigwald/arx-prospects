<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Apple-style refined gradients -->
    <linearGradient id="appleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3">
        <animate attributeName="stop-color" values="#0071e3;#0077ed;#2997ff;#0071e3" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0051a8">
        <animate attributeName="stop-color" values="#0051a8;#0071e3;#003d80;#0051a8" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="appleGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f0a">
        <animate attributeName="stop-color" values="#ff9f0a;#ffd60a;#ff9f0a" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#30d158">
        <animate attributeName="stop-color" values="#30d158;#34c759;#30d158" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="appleHalo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#30d158" stop-opacity="0"/>
    </linearGradient>

    <filter id="appleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 8px rgba(0, 113, 227, 0.6)); }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    .icon-wing {
      animation: gentleFloat 5s ease-in-out infinite;
      transform-origin: 50px 60px;
    }
    .core-orb {
      animation: subtlePulse 4s ease-in-out infinite;
      transform-origin: 72px 42px;
    }
    .apple-font-bold {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .apple-font-sub {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>

  <!-- ICON SQUIRCLE EMBLEM (Apple iOS app icon inspired) -->
  <g transform="translate(10, 14)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="92" height="92" rx="22" fill="#000000" />
    <rect x="0" y="0" width="92" height="92" rx="22" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Ambient Halo Glow -->
    <circle cx="46" cy="46" r="38" fill="url(#appleHalo)"/>

    <!-- Interlocking Harmonic Waves / Human Connection -->
    <path class="icon-wing" d="M 28 68 C 18 56, 18 36, 34 26 C 41 22, 50 24, 52 32 C 54 38, 48 44, 42 48 C 34 53, 34 64, 44 70 C 47 72, 45 78, 40 78 C 35 78, 31 74, 28 68 Z" 
          fill="url(#appleBlue)" filter="url(#appleBlur)" />

    <path d="M 44 76 C 54 78, 68 70, 72 58 C 78 44, 72 32, 60 28 C 55 26, 50 30, 52 36 C 54 42, 60 46, 62 53 C 64 62, 56 68, 48 70 C 45 71, 43 75, 44 76 Z" 
          fill="url(#appleGold)" filter="url(#appleBlur)" />

    <!-- Radiant Catalyst Orb (Apple-style precision core) -->
    <g class="core-orb">
      <circle cx="68" cy="38" r="6" fill="#ffffff" />
      <circle cx="68" cy="38" r="10" fill="none" stroke="#0071e3" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Upward Momentum Vector -->
    <path d="M 40 54 L 47 47 L 54 54" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 47 48 L 47 64" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY (Apple Human Interface clean hierarchy) -->
  <g transform="translate(122, 22)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="76" height="20" rx="10" fill="#f5f5f7" stroke="#e5e5ea" stroke-width="1"/>
    <text x="38" y="13.5" text-anchor="middle" fill="#1d1d1f" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" letter-spacing="0.06em">A.S.E.B.C.</text>

    <text x="86" y="13.5" fill="#86868b" font-size="9.5" class="apple-font-sub">ASSOCIATION LOI 1901 &bull; CANNES &amp; GRASSE</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#1d1d1f" font-size="28" class="apple-font-bold">
      Solidarité <tspan fill="#0071e3">Emploi</tspan>
    </text>

    <!-- Baseline -->
    <text x="0" y="74" fill="#6e6e73" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" letter-spacing="-0.01em">
      Bassin Cannois &amp; Pays de Grasse &mdash; Accompagnement bénévole et gratuit
    </text>
  </g>
</svg>
