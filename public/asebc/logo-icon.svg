<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="asebcBlueGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#2563eb;#0ea5e9;#0284c7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1d4ed8">
        <animate attributeName="stop-color" values="#1d4ed8;#0284c7;#1e40af;#1d4ed8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="asebcSunGradIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#fbbf24;#d97706;#f59e0b" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#059669;#34d399;#10b981" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="softGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrbIcon {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.9)); }
    }
    @keyframes floatWingIcon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes orbitPulseIcon {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 200; }
    }
    .wing-blue-i {
      animation: floatWingIcon 4.5s ease-in-out infinite;
      transform-origin: 80px 80px;
    }
    .sun-orb-i {
      animation: pulseOrbIcon 3s ease-in-out infinite;
      transform-origin: 114px 48px;
    }
    .orbit-ring-i {
      stroke-dasharray: 8 6;
      animation: orbitPulseIcon 12s linear infinite;
    }
  </style>

  <rect width="160" height="160" rx="36" fill="#0f172a" />
  
  <g transform="translate(10, 10)">
    <circle cx="70" cy="70" r="58" fill="none" stroke="#38bdf8" stroke-width="1.5" class="orbit-ring-i" opacity="0.35"/>

    <path class="wing-blue-i" d="M 45 110 C 25 90, 20 50, 48 30 C 58 23, 72 26, 75 38 C 77 46, 70 55, 62 60 C 48 68, 48 88, 65 100 C 72 105, 78 114, 70 120 C 62 125, 52 118, 45 110 Z" 
          fill="url(#asebcBlueGradIcon)" filter="url(#softGlowIcon)" />

    <path d="M 68 122 C 85 125, 105 112, 114 92 C 124 70, 115 45, 96 36 C 88 32, 80 38, 82 46 C 84 55, 94 62, 96 74 C 98 88, 86 102, 72 106 C 65 108, 62 118, 68 122 Z" 
          fill="url(#asebcSunGradIcon)" filter="url(#softGlowIcon)" />

    <g class="sun-orb-i">
      <circle cx="104" cy="52" r="11" fill="#f59e0b" />
      <circle cx="104" cy="52" r="6" fill="#fef3c7" />
      <path d="M 104 34 L 104 41 M 104 63 L 104 70 M 86 52 L 93 52 M 115 52 L 122 52" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <path d="M 62 78 L 74 65 L 86 78" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 74 66 L 74 96" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
